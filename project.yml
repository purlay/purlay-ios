name: Purlay
options:
  bundleIdPrefix: dev.purlay
  developmentLanguage: en
  knownRegions: [en, tr]
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
packages:
  PurlaySwift:
    url: https://github.com/purlay/purlay-swift
    from: 0.1.0
  PurlayModuleAPI: { path: Packages/PurlayModuleAPI }
  PurlayDesign: { path: Packages/PurlayDesign }
targets:
  Purlay:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: PurlaySwift
        product: PurlayContract
      - package: PurlaySwift
        product: PurlayTokens
      - package: PurlaySwift
        product: PurlayKit
      - package: PurlayModuleAPI
      - package: PurlayDesign
  PurlayTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/PurlayTests]
    settings:
      base:
        PRODUCT_NAME: PurlayTests
        PRODUCT_BUNDLE_IDENTIFIER: dev.purlay.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: ""
        INFOPLIST_PREPROCESS: NO
    dependencies:
      - target: Purlay
schemes:
  Purlay:
    build:
      targets: { Purlay: all }
    test:
      targets: [PurlayTests]
